<!DOCTYPE html><html lang="en"><head><title>Face Detection - HeadCount AI</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="detection"><nav id="sidebar"></nav>
<main class="content">
<h2 class="page-title">Face Detection</h2><div class="text-muted mb-3">Count faces from your webcam or an image</div>
<ul class="nav nav-pills mb-3">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabLive"><i class="bi bi-camera-video me-2"></i>Live camera</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabImage"><i class="bi bi-image me-2"></i>Upload image</button></li>
</ul>
<div class="tab-content">
<div class="tab-pane fade show active" id="tabLive"><div class="row g-3">
  <div class="col-lg-8"><div class="card-x"><div class="stage">
    <video id="video" playsinline muted></video><canvas id="overlay"></canvas>
    <div class="hint" id="camHint"><i class="bi bi-camera-video-off me-2"></i>Camera is off</div></div>
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <button class="btn btn-primary" id="btnStart"><i class="bi bi-play-fill me-1"></i>Start camera</button>
      <button class="btn btn-outline-danger" id="btnStop" disabled><i class="bi bi-stop-fill me-1"></i>Stop camera</button>
      <button class="btn btn-outline-secondary" id="btnClear"><i class="bi bi-x-circle me-1"></i>Clear results</button></div></div></div>
  <div class="col-lg-4"><div class="card-x text-center"><div class="text-muted">Faces in view</div>
    <div class="counter" id="liveCount">0</div><span id="liveStatus" class="badge bg-secondary">Stopped</span>
    <p class="small text-muted mt-3 mb-0">When you stop the camera, one summary record (peak face count) is saved to History.</p></div></div>
</div></div>
<div class="tab-pane fade" id="tabImage"><div class="row g-3">
  <div class="col-lg-8"><div class="card-x">
    <input type="file" id="imgInput" class="form-control mb-3" accept=".jpg,.jpeg,.png,.bmp,.webp,image/*">
    <div class="stage"><img id="imgPreview" class="d-none" alt="Preview"><img id="imgResult" class="d-none" alt="Result">
      <div class="hint" style="pointer-events:none">Choose an image to preview it here</div></div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" id="btnDetect" disabled><i class="bi bi-search me-1"></i>Detect faces</button>
      <button class="btn btn-outline-secondary" id="btnReset"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button></div></div></div>
  <div class="col-lg-4"><div class="card-x text-center"><div class="text-muted">Faces detected</div><div class="counter" id="imgCount">0</div>
    <p class="small text-muted mt-3 mb-0">JPG, PNG, BMP or WEBP, up to 10 MB.</p></div></div>
</div></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script><script src="js/camera.js"></script><script src="js/detection.js"></script></body></html>
