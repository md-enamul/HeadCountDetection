<!DOCTYPE html><html lang="en"><head><title>Dashboard - HeadCount AI</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="dashboard"><nav id="sidebar"></nav>
<main class="content">
<div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
  <div><h2 class="page-title">Dashboard</h2><div class="text-muted">Overview of all detections</div></div>
  <span id="sysStatus" class="badge bg-secondary">Checking...</span></div>
<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3"><div class="card-x stat d-flex justify-content-between"><div><div class="label">Total faces detected</div><div class="num" id="totalFaces">0</div></div><i class="bi bi-people"></i></div></div>
  <div class="col-6 col-lg-3"><div class="card-x stat d-flex justify-content-between"><div><div class="label">Detection sessions</div><div class="num" id="totalSessions">0</div></div><i class="bi bi-collection"></i></div></div>
  <div class="col-6 col-lg-3"><div class="card-x stat d-flex justify-content-between"><div><div class="label">Image detections</div><div class="num" id="imageCount">0</div></div><i class="bi bi-image"></i></div></div>
  <div class="col-6 col-lg-3"><div class="card-x stat d-flex justify-content-between"><div><div class="label">Webcam detections</div><div class="num" id="webcamCount">0</div></div><i class="bi bi-camera-video"></i></div></div>
</div>
<div class="card-x"><h5 class="mb-3">Recent detections</h5>
<div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Type</th><th>Faces</th><th>When</th></tr></thead>
<tbody id="recentBody"></tbody></table></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script><script src="js/history.js"></script></body></html>
